# go-pmtiles serving the basemap archive on the pmtiles PVC. The tile-server proxies
# /basemap/tiles/* here. The fetch-basemap init container fills the volume on first start
# (a CONUS extract takes ~10-40 min depending on your connection); later starts skip it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basemap
  namespace: radar-ng
  labels:
    app: basemap
spec:
  replicas: 1
  # An empty volume means a long extract before the pod starts; don't flag that as a failed rollout.
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: basemap
  template:
    metadata:
      labels:
        app: basemap
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-basemap
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/opt/scripts/fetch-basemap.sh"]
          env:
            # Extract bbox minLon,minLat,maxLon,maxLat. Default: continental US.
            # To try things out faster, use a small area, e.g. Michigan: -90.5,41.6,-82.1,48.4
            - name: BBOX
              value: "-125,24,-66,50"
            # Bump to force a re-extract of a fresher Protomaps build without changing the bbox.
            - name: REFRESH
              value: "1"
            # Highest zoom kept. The bundled styles stop at 14; raise only with a custom style.
            - name: MAXZOOM
              value: "14"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: scripts
              mountPath: /opt/scripts
              readOnly: true
            - name: pmtiles
              mountPath: /data
      containers:
        - name: basemap
          # Keep this version in step with PMTILES_VERSION in fetch-basemap.sh.
          image: docker.io/protomaps/go-pmtiles:v1.31.2@sha256:06574f01f55a78f78f887bc7ebf729a5c093c0d6e17d9876300cfcb0758b59d3
          imagePullPolicy: IfNotPresent
          args: ["serve", "/data", "--port", "8081", "--cors", "*"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8081
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: pmtiles
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: scripts
          configMap:
            name: radar-ng-scripts
            defaultMode: 0555
        - name: pmtiles
          persistentVolumeClaim:
            claimName: pmtiles

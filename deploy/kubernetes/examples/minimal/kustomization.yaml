# Try radar-ng on a single-node cluster (kind, k3d, k3s, Docker Desktop):
#
#   kubectl apply -k deploy/kubernetes/examples/minimal
#
# base (api, worker, open-meteo, basemap, volumes) + a throwaway Temporal in the same namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/temporal-dev

configMapGenerator:
  - name: radar-ng-settings
    behavior: merge
    literals:
      # >>> CHANGE THIS <<<  api.weather.gov wants a real contact address.
      - NWS_USER_AGENT=(radar-ng, you@example.com)

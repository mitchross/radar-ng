apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radar-ng-api
  namespace: radar-ng
spec:
  parentRefs:
    # <<< your Gateway
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: my-gateway
      namespace: gateway
  hostnames:
    - radar-ng-api.example.com   # <<< your hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: tile-server
          port: 8080

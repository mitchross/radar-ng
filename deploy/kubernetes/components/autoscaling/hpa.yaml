# maxReplicas stays 1 while the api mounts RWO volumes: a higher cap promises a topology
# Kubernetes can't attach. Raise it only after tiles move to RWX or object storage, and size the
# range with docs/reference/capacity-acceptance.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tile-server
  namespace: radar-ng
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tile-server
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

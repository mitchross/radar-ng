apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-postgres
  namespace: radar-ng
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: radar-ng
  labels:
    app: temporal-postgres
spec:
  selector:
    app: temporal-postgres
  ports:
    - { port: 5432, targetPort: 5432, name: postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-postgres
  namespace: radar-ng
  labels:
    app: temporal-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal-postgres
  template:
    metadata:
      labels:
        app: temporal-postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          env:
            # Throwaway credentials, same as deploy/docker-compose.yml. Only reachable in-cluster.
            - { name: POSTGRES_USER, value: temporal }
            - { name: POSTGRES_PASSWORD, value: temporal }
            - { name: POSTGRES_DB, value: temporal }
            # A subdirectory, because some volumes come with a lost+found directory at the root.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { containerPort: 5432, name: postgres }
          readinessProbe:
            exec:
              command: [pg_isready, -U, temporal]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-postgres

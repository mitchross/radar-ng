apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: radar-ng
  labels:
    app: temporal
spec:
  selector:
    app: temporal
  ports:
    - { port: 7233, targetPort: 7233, name: grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: radar-ng
  labels:
    app: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      # A Service called `temporal` would otherwise inject TEMPORAL_* variables into the pod.
      enableServiceLinks: false
      containers:
        - name: temporal
          # auto-setup creates the schema and the `default` namespace on first start (it retries
          # until Postgres is up).
          image: docker.io/temporalio/auto-setup:1.25.2
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: temporal }
            - { name: POSTGRES_PWD, value: temporal }
            - { name: POSTGRES_SEEDS, value: temporal-postgres }
            - { name: DEFAULT_NAMESPACE, value: default }
            - { name: DEFAULT_NAMESPACE_RETENTION, value: 1d }
            # Listen on all interfaces so the Service can reach the frontend.
            - { name: BIND_ON_IP, value: 0.0.0.0 }
          ports:
            - { containerPort: 7233, name: grpc }
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: radar-ng
  labels:
    app: temporal-ui
spec:
  selector:
    app: temporal-ui
  ports:
    - { port: 8080, targetPort: 8080, name: http }
---
# Web UI: kubectl -n radar-ng port-forward svc/temporal-ui 8233:8080, then http://localhost:8233
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: radar-ng
  labels:
    app: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: docker.io/temporalio/ui:2.31.2
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
          ports:
            - { containerPort: 8080, name: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }

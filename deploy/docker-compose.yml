# radar-ng single-node stack.
#
# One `legacy` worker on task queue `radar-ng` (every workflow, Schedules on radar-ng) plus the
# open-meteo worker. One radar image (deploy/Dockerfile) runs the api and the worker; the role is
# the command. Production splits the worker into five role pools on isolated queues; the commented
# block at the bottom shows that layout.
#
# Usage (from deploy/, the directory this file lives in):
#   ./up.sh                           # does everything below, waits for the first radar frame,
#                                     # and prints the URL for the app
# or by hand:
#   cp .env.example .env              # set NWS_USER_AGENT
#   docker compose run --rm basemap-bootstrap   # one-time ~9 GB download of the newest basemap
#   docker compose up -d
#
#   curl http://localhost:8080/api/livez
#   curl http://localhost:8080/api/manifest.json | jq '.layers | keys'
#
# Images: the prebuilt GHCR images below (linux/amd64), pinned by tag and digest. To build from this
# checkout instead (arm64 hosts such as Apple Silicon, or when you change the Rust code):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build    # or ./up.sh --build
# Or point at your own registry with RADAR_API_IMAGE / RADAR_WORKER_IMAGE / RADAR_OPEN_METEO_WORKER_IMAGE.
# Upstream bumps the pins here together with deploy/kubernetes/base on each release.
#
# Optional Temporal Web UI (http://localhost:8233):
#   docker compose --profile ui up -d

name: radar-ng

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Temporal connection shared by the api and the workers.
x-temporal-env: &temporal-env
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}

# Tunables for the worker. Lab-sized defaults; production values are in the talos-argocd-proxmox
# radar-ng manifests (temporal-workers/configmap-temporal-config.yaml).
x-worker-env: &worker-env
  <<: *temporal-env
  TILE_DIR: /data/tiles
  GRID_DIR: /data/grids
  STATE_DIR: /data/state
  TEMPORAL_GRACEFUL_SHUTDOWN_S: "25"
  SKIP_SCHEDULE_SEED: ${SKIP_SCHEDULE_SEED:-0}
  PALETTES: ${PALETTES:-classic,muted,vivid}
  BACKLOG_PER_CYCLE: ${BACKLOG_PER_CYCLE:-2}
  TEMPORAL_MAX_CONCURRENT_ACTIVITIES: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-2}
  TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLS: ${TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLS:-1}
  FORECAST_HOURS: ${FORECAST_HOURS:-18}
  EXTENDED_FORECAST_HOURS: ${EXTENDED_FORECAST_HOURS:-48}
  # HRRR secondary layers: wind, rain total, precip type, temperature, feels like, dew point, clouds.
  HRRR_ENABLED_LAYERS: ${HRRR_ENABLED_LAYERS:-radar-hrrr,wind,precip-accum,precip-type,temperature,feels-like,dewpoint,cloud}
  # MRMS observed 24-hour precipitation layer (precip-24h).
  MRMS_QPE_24H_ENABLED: ${MRMS_QPE_24H_ENABLED:-1}
  NOWCAST_HORIZON_MIN: ${NOWCAST_HORIZON_MIN:-60}
  NOWCAST_STEP_MIN: ${NOWCAST_STEP_MIN:-5}
  NOWCAST_INPUT_FRAMES: ${NOWCAST_INPUT_FRAMES:-4}
  # NWS requires a contact in the User-Agent. Set NWS_USER_AGENT in .env before going live.
  NWS_USER_AGENT: ${NWS_USER_AGENT:-(radar-ng, you@example.com)}
  NWS_ALERTS_URL: ${NWS_ALERTS_URL:-https://api.weather.gov/alerts/active?status=actual}
  TROPICAL_FEED_URL: ${TROPICAL_FEED_URL:-https://www.nhc.noaa.gov/CurrentStorms.json}
  INTENSIFY_DBZ_DELTA: ${INTENSIFY_DBZ_DELTA:-10}
  DISSIPATE_DBZ_DELTA: ${DISSIPATE_DBZ_DELTA:-10}
  HAIL_DBZ_THRESHOLD: ${HAIL_DBZ_THRESHOLD:-60}
  LIGHTNING_RETENTION_MIN: ${LIGHTNING_RETENTION_MIN:-15}
  LIGHTNING_FLUSH_S: ${LIGHTNING_FLUSH_S:-2.0}
  # Push notifications are a no-op unless APNS/FCM credentials are wired in.
  PUSH_DISABLED: ${PUSH_DISABLED:-1}

# Worker liveness: the worker loop touches /tmp/worker-alive every 30 s (radar-worker health.rs).
# A missing file means the loop never started. Staleness is not checked here.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "/usr/local/bin/busybox", "test", "-f", "/tmp/worker-alive"]
  interval: 60s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  # --- Temporal (workflow engine) -----------------------------------------
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  temporal:
    # Compose is a local stand-in. Production runs the cluster's Temporal server, which already
    # serves the Worker Deployments the production TWDs use. This image is for the local stack only.
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DEFAULT_NAMESPACE=default
      - DEFAULT_NAMESPACE_RETENTION=1d
      # auto-setup binds the frontend to the container's own IP, not loopback. Force
      # all-interfaces so the healthcheck below (127.0.0.1:7233) can reach it.
      - BIND_ON_IP=0.0.0.0
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  # Optional Web UI, enabled with `--profile ui`. Host port 8233 because the api owns 8080.
  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["ui"]
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    logging: *default-logging
    restart: unless-stopped

  # --- Volume ownership ------------------------------------------------------
  # Named volumes are created root-owned; the images run as uid 1000 (open-meteo: 999). This
  # one-shot chowns the volumes before anything else starts.
  volume-init:
    image: busybox:1.36-musl
    user: "0:0"
    command:
      - sh
      - -c
      - "chown -R 1000:1000 /v/tiles /v/grids /v/state /v/basemap && chown -R 999:999 /v/openmeteo"
    volumes:
      - tiles:/v/tiles
      - grids:/v/grids
      - state:/v/state
      - openmeteo-data:/v/openmeteo
      - basemap-data:/v/basemap
    restart: "no"

  # --- Workers ---------------------------------------------------------------
  # Legacy role: all workflows on radar-ng. This worker also seeds the Schedules at boot. One seeder only, so leave SEED_SCHEDULES=1 on this service alone.
  worker:
    image: ${RADAR_WORKER_IMAGE:-ghcr.io/mitchross/radar-ng-temporal-worker:v2.0.9@sha256:1432031a17e5126eb591a4e0cb3e72f632283a45c3c190fe8cd7865dc51b64a9}
    command: ["worker", "--role", "legacy"]
    environment:
      <<: *worker-env
      WORKER_ROLE: legacy
      SEED_SCHEDULES: "1"
    depends_on:
      temporal:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    volumes:
      - tiles:/data/tiles
      - grids:/data/grids
      - state:/data/state
    healthcheck: *worker-healthcheck
    logging: *default-logging
    restart: unless-stopped

  # open-meteo role: the radar binary on the Open-Meteo image. Syncs GFS/HRRR model data into
  # openmeteo-data, which the open-meteo service serves. The `open-meteo` target of the same Dockerfile.
  open-meteo-worker:
    image: ${RADAR_OPEN_METEO_WORKER_IMAGE:-ghcr.io/mitchross/radar-ng-open-meteo-worker:v2.0.9@sha256:1d7c2195d082a6872551d3d4cc5300d054a718a822839aa10d24b1bcce546f07}
    command: ["worker", "--role", "open-meteo"]
    environment:
      <<: *temporal-env
      WORKER_ROLE: open-meteo
      TEMPORAL_GRACEFUL_SHUTDOWN_S: "25"
      OPENMETEO_BIN: /app/openmeteo-api
      OPENMETEO_DATA_DIR: /app/data
    depends_on:
      temporal:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    volumes:
      - openmeteo-data:/app/data
    healthcheck: *worker-healthcheck
    logging: *default-logging
    restart: unless-stopped

  # --- Forecast data (Open-Meteo API) ----------------------------------------
  # Serves what open-meteo-worker syncs. Starts empty; the open-meteo sync schedules fill
  # /app/data. Until the first sync completes, /api/forecast responses are null or empty.
  open-meteo:
    # Pinned to the same digest as deploy/Dockerfile (open-meteo target). Upstream :latest has shipped
    # broken builds (1.5.3 missing libparquet-glib crashed serve with exit 127). Bump both together.
    image: ghcr.io/open-meteo/open-meteo:1.6.0@sha256:e1517a01a061fd96e2a9017d022c5809bb51725bcd733bcbed435e7ea32dd9da
    command: ["serve", "--bind", "0.0.0.0:8080"]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - openmeteo-data:/app/data
    healthcheck:
      # Port-answers check. -f is omitted on purpose: an empty-data instance can 404 and still
      # be healthy.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  # --- Basemap bootstrap (one-shot) -------------------------------------------
  # The api serves basemap.pmtiles directly (BASEMAP_PMTILES). The go-pmtiles sidecar is gone.
  # The download goes to basemap.pmtiles.partial, and basemap-publish renames it over the served path (F6).
  # The api reopens the archive when its file identity changes, so a rename takes effect without a restart.
  # Writing the served path in place would expose a half-written archive, so do not do that.
  # build.protomaps.com serves date-stamped builds (YYYYMMDD.pmtiles), about 6 days of retention,
  # and no `latest` alias. The script (shared with the Kubernetes init container) walks back from
  # today to the newest build, verifies the go-pmtiles download by sha256, extracts the bbox to a temp
  # file and renames it over basemap.pmtiles. It skips the work when the marker says it's done, so it is
  # safe to run every time. Set BASEMAP_PMTILES_URL only to pin a specific build.
  basemap-bootstrap:
    image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    profiles: ["bootstrap"]
    command: ["sh", "/opt/scripts/fetch-basemap.sh"]
    environment:
      BBOX: ${BASEMAP_BBOX:--125,24,-66,50}
      PMTILES_URL: ${BASEMAP_PMTILES_URL:-}
      MAXZOOM: ${BASEMAP_MAXZOOM:-14}
      OUT: /data/basemap.pmtiles
    volumes:
      - basemap-data:/data
      - ./kubernetes/base/fetch-basemap.sh:/opt/scripts/fetch-basemap.sh:ro
    restart: "no"

  # Kept so older instructions still work: basemap-bootstrap now publishes atomically by itself, so this
  # only moves a leftover .partial from the old two-step flow, and otherwise does nothing.
  basemap-publish:
    image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    profiles: ["bootstrap"]
    command: ["sh", "-c", "if [ -f /data/basemap.pmtiles.partial ]; then mv -f /data/basemap.pmtiles.partial /data/basemap.pmtiles; else echo 'nothing to publish (basemap-bootstrap already did)'; fi"]
    volumes:
      - basemap-data:/data
    restart: "no"

  # --- Public API ------------------------------------------------------------
  # The Rust api serves tiles, the manifest, the basemap (PMTiles and styles), and /api/*. The
  # Caddy and FastAPI sidecars are gone. The public endpoint is this service.
  api:
    image: ${RADAR_API_IMAGE:-ghcr.io/mitchross/radar-ng-tile-server:v2.0.9@sha256:3981502164c2f366f123cad41378a956483247fe7015e1e104ab3703050424dc}
    command: ["api"]
    ports:
      - "${TILE_SERVER_PORT:-8080}:8080"
    depends_on:
      temporal:
        condition: service_healthy
      open-meteo:
        condition: service_started
      volume-init:
        condition: service_completed_successfully
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      # WatchStormWorkflow start queue. Legacy runs every workflow on radar-ng, so the watch
      # must start there (the code default, radar-ng-alerts, is for isolated queues).
      - TEMPORAL_ALERTS_TASK_QUEUE=radar-ng
      - OPEN_METEO_BASE=${OPEN_METEO_BASE:-http://open-meteo:8080/v1/forecast}
      - MRMS_MAX_AGE_S=${MRMS_MAX_AGE_S:-600}
      # Code default is 900 (radar-api/src/config.rs).
      - FORECAST_TTL_S=${FORECAST_TTL_S:-900}
      - BASEMAP_PMTILES=/basemap/basemap.pmtiles
      # Same contact the workers send (x-worker-env); NWS rejects anonymous clients.
      - NWS_USER_AGENT=${NWS_USER_AGENT:-(radar-ng, you@example.com)}
    volumes:
      - tiles:/data/tiles:ro
      - grids:/data/grids:ro
      - state:/data/state:ro
      - basemap-data:/basemap:ro
    healthcheck:
      # The image has busybox but no curl. /api/livez is process liveness, so this check never
      # depends on radar freshness. /api/health reports 503 when stale and is not used here.
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/livez"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  # --- Optional: per-role isolated queues (the production layout) -----------
  # Set USE_ISOLATED_TASK_QUEUES=1 on the workers, drop the api's TEMPORAL_ALERTS_TASK_QUEUE
  # override (default radar-ng-alerts), then replace `worker` with one service per role. Each polls its default isolated
  # queue (radar-ng-<role>), and the seeder rewrites every Schedule to its declared queue.
  #
  # mrms:
  #   image: ${RADAR_WORKER_IMAGE:-<same as worker above>}
  #   command: ["worker", "--role", "mrms"]
  #   environment:
  #     <<: *worker-env
  #     WORKER_ROLE: mrms
  #     USE_ISOLATED_TASK_QUEUES: "1"
  #   depends_on:
  #     temporal:
  #       condition: service_healthy
  #     volume-init:
  #       condition: service_completed_successfully
  #   volumes:
  #     - tiles:/data/tiles
  #     - grids:/data/grids
  #     - state:/data/state
  #   healthcheck: *worker-healthcheck
  #   restart: unless-stopped
  # (same shape for nowcast, hrrr, aux, alerts; SEED_SCHEDULES=1 on exactly one of them)

volumes:
  tiles:
    driver: local
  grids:
    driver: local
  state:
    driver: local
  openmeteo-data:
    driver: local
  basemap-data:
    driver: local
  temporal-pg-data:
    driver: local

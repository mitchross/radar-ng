# Throwaway Temporal for the radar-worker integration tests (CI job `temporal` in ci-rust.yml).
#
# Usage:
#   docker compose -f deploy/temporal-dev.yml up -d postgres temporal
#   cd rust && TEMPORAL_TEST_ADDRESS=localhost:7233 cargo test -p radar-worker --test integration
#   docker compose -f deploy/temporal-dev.yml up -d temporal-ui   # optional Web UI at :8080
#   docker compose -f deploy/temporal-dev.yml down -v
#
# Brings up:
#   - postgres:     backing store for Temporal (cleared by `down -v`)
#   - temporal:     Temporal server bootstrapped via auto-setup
#   - temporal-ui:  Web UI at :8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: radar-ng-temporal-pg
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: radar-ng-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - DEFAULT_NAMESPACE=default
      - DEFAULT_NAMESPACE_RETENTION=1d
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: radar-ng-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  pg-data:

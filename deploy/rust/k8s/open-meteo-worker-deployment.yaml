# radar-ng open-meteo worker: the production TemporalWorkerDeployment, now on the Rust build.
#
# Same TWD as deploy/k8s/open-meteo-worker-deployment.yaml in the Python tree. The image is
# the Dockerfile.open-meteo build (the radar binary on the pinned Open-Meteo image), which runs
# `radar worker --role open-meteo` and subprocess-execs /app/openmeteo-api for model syncs.
# Uid 999 is the upstream Open-Meteo user, kept from the Python deployment.
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkerDeployment
metadata:
  name: radar-ng-open-meteo-worker
  namespace: radar-ng
  labels:
    app: radar-ng-open-meteo-worker
spec:
  replicas: 1
  workerOptions:
    connectionRef:
      name: cluster-temporal
    temporalNamespace: default
  rollout:
    # FIRST CUTOVER: slow ramp, same reasoning as temporal-worker-deployment.yaml. Single
    # replica: each step is one observe window. Restore the Python values after the cutover.
    strategy: Progressive
    steps:
      - rampPercentage: 5
        pauseDuration: 30m
      - rampPercentage: 25
        pauseDuration: 1h
      - rampPercentage: 50
        pauseDuration: 2h
    # Python steady-state values, restore after the cutover:
    # steps:
    #   - rampPercentage: 50
    #     pauseDuration: 1m
  sunset:
    scaledownDelay: 5m
    deleteDelay: 30m
  template:
    metadata:
      labels:
        app: radar-ng-open-meteo-worker
    spec:
      # Upstream Open-Meteo image runs as uid 999.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 35
      containers:
        - name: worker
          image: registry.vanillax.me/radar-ng-open-meteo-worker:REPLACE_ME   # set to the Rust build tag
          imagePullPolicy: Always
          args: ["worker", "--role", "open-meteo"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: WORKER_ROLE
              value: open-meteo
            - name: OPENMETEO_BIN
              value: /app/openmeteo-api
            - name: OPENMETEO_DATA_DIR
              value: /app/data
          volumeMounts:
            - { name: openmeteo-data, mountPath: /app/data }
          livenessProbe:
            # The health loop touches /tmp/worker-alive every 30 s from its own task, so it keeps
            # ticking during a sync (open_meteo_sync runs up to ~35 min). Timings are generous: a
            # restart only happens after ~5 minutes with no file. busybox is copied into the image
            # by Dockerfile.open-meteo (F2).
            exec:
              command: ["/usr/local/bin/busybox", "test", "-f", "/tmp/worker-alive"]
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: { cpu: "200m",  memory: "512Mi" }
            limits:   { cpu: "2",     memory: "4Gi" }
      volumes:
        - name: openmeteo-data
          persistentVolumeClaim:
            claimName: openmeteo-data

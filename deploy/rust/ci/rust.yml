# Rust CI for radar-ng: fmt, clippy (deny warnings), tests, and the container images.
#
# Lives in deploy/rust/ci/ until copied to .github/workflows/ (or the Gitea
# equivalent). Paths assume the repository root holds rust/ (the Cargo workspace) and
# deploy/ (these assets). Adjust working-directory and paths if the layout differs.

name: rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "deploy/**"
      - "backend/basemap/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "deploy/**"
      - "backend/basemap/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.92"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          PROTOC: /usr/bin/protoc

  test:
    name: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --locked
        env:
          PROTOC: /usr/bin/protoc

  docker:
    name: docker images
    needs: [fmt, clippy, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build radar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/rust/Dockerfile
          tags: radar-ng-radar:ci
          load: true
          cache-from: type=gha,scope=radar
          cache-to: type=gha,mode=max,scope=radar

      - name: glibc floor (radar binary vs open-meteo base)
        run: |
          set -euo pipefail
          cid=$(docker create radar-ng-radar:ci)
          docker cp "$cid:/usr/local/bin/radar" ./radar-check
          docker rm "$cid" >/dev/null
          top=$(objdump -T ./radar-check | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          # The open-meteo base is glibc 2.36 at the time of writing. Bump this floor with the pin.
          floor=2.36
          newest=$(printf '%s\n%s\n' "$top" "$floor" | sort -V | tail -1)
          echo "radar needs GLIBC up to ${top}; open-meteo base floor is ${floor}"
          if [ "$newest" != "$floor" ]; then
            echo "radar requires GLIBC ${top}, above the open-meteo base floor ${floor}" >&2
            exit 1
          fi

      - name: Build open-meteo worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/rust/Dockerfile.open-meteo
          build-args: |
            RADAR_IMAGE=radar-ng-radar:ci
          tags: radar-ng-open-meteo-worker:ci
          load: true
          cache-from: type=gha,scope=open-meteo
          cache-to: type=gha,mode=max,scope=open-meteo

      - name: Check image users
        run: |
          set -euo pipefail
          test "$(docker image inspect radar-ng-radar:ci --format '{{.Config.User}}')" = "1000:1000"
          test "$(docker image inspect radar-ng-open-meteo-worker:ci --format '{{.Config.User}}')" = "999:999"

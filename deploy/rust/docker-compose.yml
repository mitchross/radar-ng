# radar-ng single-node quick start, Rust build of the production topology.
#
# Mirrors the production TemporalWorkerDeployments: one legacy worker on task queue `radar-ng`
# (every workflow, Schedules on radar-ng) plus the open-meteo worker. One radar image
# (deploy/rust/Dockerfile) runs the api and the worker; the role is the command.
#
# Per-role isolated queues are a documented future option and are commented out at the bottom.
#
# Usage (from deploy/, the directory this file lives in):
#   cp .env.example .env              # at minimum: NWS_USER_AGENT, BASEMAP_PMTILES_URL
#   docker compose run --rm basemap-bootstrap   # one-shot, ~1-2 GB range download to basemap.pmtiles.partial
#   docker compose run --rm basemap-publish     # renames the download into place
#   docker compose build api                    # radar image first: open-meteo-worker needs it
#   docker compose up -d --build
#
#   curl http://localhost:8080/api/livez
#   curl http://localhost:8080/api/manifest.json | jq '.layers | keys'
#   radar debug doctor
#
# Optional Temporal Web UI (http://localhost:8233):
#   docker compose --profile ui up -d
#
# Build context: the repository root (../..). The Dockerfiles copy rust/ and backend/basemap/
# and nothing else; deploy/rust/Dockerfile.dockerignore keeps the context small.

name: radar-ng

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Temporal connection shared by the api and the workers.
x-temporal-env: &temporal-env
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}

# Tunables for the worker. Lab-sized defaults; production values are in
# k8s/configmap-temporal-config.yaml.
x-worker-env: &worker-env
  <<: *temporal-env
  TILE_DIR: /data/tiles
  GRID_DIR: /data/grids
  STATE_DIR: /data/state
  TEMPORAL_GRACEFUL_SHUTDOWN_S: "25"
  SKIP_SCHEDULE_SEED: ${SKIP_SCHEDULE_SEED:-0}
  PALETTES: ${PALETTES:-classic,muted,vivid}
  BACKLOG_PER_CYCLE: ${BACKLOG_PER_CYCLE:-2}
  TEMPORAL_MAX_CONCURRENT_ACTIVITIES: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-2}
  TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLS: ${TEMPORAL_MAX_CONCURRENT_ACTIVITY_TASK_POLLS:-1}
  FORECAST_HOURS: ${FORECAST_HOURS:-18}
  EXTENDED_FORECAST_HOURS: ${EXTENDED_FORECAST_HOURS:-48}
  # HRRR secondary layers: wind, rain total, precip type, temperature, clouds.
  HRRR_ENABLED_LAYERS: ${HRRR_ENABLED_LAYERS:-radar-hrrr,wind,precip-accum,precip-type,temperature,cloud}
  NOWCAST_HORIZON_MIN: ${NOWCAST_HORIZON_MIN:-60}
  NOWCAST_STEP_MIN: ${NOWCAST_STEP_MIN:-5}
  NOWCAST_INPUT_FRAMES: ${NOWCAST_INPUT_FRAMES:-4}
  # NWS requires a contact in the User-Agent. Set NWS_USER_AGENT in .env before going live.
  NWS_USER_AGENT: ${NWS_USER_AGENT:-(radar-ng, you@example.com)}
  NWS_ALERTS_URL: ${NWS_ALERTS_URL:-https://api.weather.gov/alerts/active?status=actual}
  TROPICAL_FEED_URL: ${TROPICAL_FEED_URL:-https://www.nhc.noaa.gov/CurrentStorms.json}
  INTENSIFY_DBZ_DELTA: ${INTENSIFY_DBZ_DELTA:-10}
  DISSIPATE_DBZ_DELTA: ${DISSIPATE_DBZ_DELTA:-10}
  HAIL_DBZ_THRESHOLD: ${HAIL_DBZ_THRESHOLD:-60}
  LIGHTNING_RETENTION_MIN: ${LIGHTNING_RETENTION_MIN:-15}
  LIGHTNING_FLUSH_S: ${LIGHTNING_FLUSH_S:-2.0}
  # Push notifications are a no-op unless APNS/FCM credentials are wired in.
  PUSH_DISABLED: ${PUSH_DISABLED:-1}

# Worker liveness: the worker loop touches /tmp/worker-alive every 30 s (radar-worker health.rs).
# A missing file means the loop never started. Staleness is not checked here.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "/usr/local/bin/busybox", "test", "-f", "/tmp/worker-alive"]
  interval: 60s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  # --- Temporal (workflow engine) -----------------------------------------
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  temporal:
    # Compose is a local stand-in. Production runs the cluster's Temporal server, which already
    # serves the Worker Deployments the production TWDs use. This image is for the local stack only.
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - DEFAULT_NAMESPACE=default
      - DEFAULT_NAMESPACE_RETENTION=1d
      # auto-setup binds the frontend to the container's own IP, not loopback. Force
      # all-interfaces so the healthcheck below (127.0.0.1:7233) can reach it.
      - BIND_ON_IP=0.0.0.0
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  # Optional Web UI, enabled with `--profile ui`. Host port 8233 because the api owns 8080.
  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["ui"]
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    logging: *default-logging
    restart: unless-stopped

  # --- Volume ownership ------------------------------------------------------
  # Named volumes are created root-owned. The Python worker ran as root and could write them;
  # the Rust images run as uid 1000 (open-meteo: 999). This one-shot chowns the volumes before
  # anything else starts.
  volume-init:
    image: busybox:1.36-musl
    user: "0:0"
    command:
      - sh
      - -c
      - "chown -R 1000:1000 /v/tiles /v/grids /v/state /v/basemap && chown -R 999:999 /v/openmeteo"
    volumes:
      - tiles:/v/tiles
      - grids:/v/grids
      - state:/v/state
      - openmeteo-data:/v/openmeteo
      - basemap-data:/v/basemap
    restart: "no"

  # --- Workers ---------------------------------------------------------------
  # Production legacy role: all workflows on radar-ng. In the legacy model this worker also
  # seeds the Schedules at boot. One seeder only, so leave SEED_SCHEDULES=1 on this service alone.
  worker:
    image: radar-ng-radar:local
    pull_policy: never
    command: ["worker", "--role", "legacy"]
    environment:
      <<: *worker-env
      WORKER_ROLE: legacy
      SEED_SCHEDULES: "1"
    depends_on:
      temporal:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    volumes:
      - tiles:/data/tiles
      - grids:/data/grids
      - state:/data/state
    healthcheck: *worker-healthcheck
    logging: *default-logging
    restart: unless-stopped

  # open-meteo role: the radar binary on the Open-Meteo image. Syncs GFS/HRRR model data into
  # openmeteo-data, which the open-meteo service serves. The `open-meteo` target of the same Dockerfile.
  open-meteo-worker:
    build:
      context: ../..
      dockerfile: deploy/rust/Dockerfile
      target: open-meteo
    image: radar-ng-open-meteo-worker:local
    command: ["worker", "--role", "open-meteo"]
    environment:
      <<: *temporal-env
      WORKER_ROLE: open-meteo
      TEMPORAL_GRACEFUL_SHUTDOWN_S: "25"
      OPENMETEO_BIN: /app/openmeteo-api
      OPENMETEO_DATA_DIR: /app/data
    depends_on:
      temporal:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    volumes:
      - openmeteo-data:/app/data
    healthcheck: *worker-healthcheck
    logging: *default-logging
    restart: unless-stopped

  # --- Forecast data (Open-Meteo API) ----------------------------------------
  # Serves what open-meteo-worker syncs. Starts empty; the open-meteo sync schedules fill
  # /app/data. Until the first sync completes, /api/forecast responses are null or empty.
  open-meteo:
    # Pinned to the same digest as deploy/rust/Dockerfile (open-meteo target). Upstream :latest has shipped
    # broken builds (1.5.3 missing libparquet-glib crashed serve with exit 127). Bump both together.
    image: ghcr.io/open-meteo/open-meteo:1.6.0@sha256:e1517a01a061fd96e2a9017d022c5809bb51725bcd733bcbed435e7ea32dd9da
    command: ["serve", "--bind", "0.0.0.0:8080"]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - openmeteo-data:/app/data
    healthcheck:
      # Port-answers check. -f is omitted on purpose: an empty-data instance can 404 and still
      # be healthy.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  # --- Basemap bootstrap (one-shot) -------------------------------------------
  # The api serves basemap.pmtiles directly (BASEMAP_PMTILES). The go-pmtiles sidecar is gone.
  # The download goes to basemap.pmtiles.partial, and basemap-publish renames it over the served path (F6).
  # The api reopens the archive when its file identity changes, so a rename takes effect without a restart.
  # Writing the served path in place would expose a half-written archive, so do not do that.
  # build.protomaps.com serves date-stamped builds (YYYYMMDD.pmtiles), about 6 days of retention,
  # and no `latest` alias. Set BASEMAP_PMTILES_URL in .env to a recent date.
  basemap-bootstrap:
    image: protomaps/go-pmtiles:latest
    profiles: ["bootstrap"]
    command:
      - extract
      - ${BASEMAP_PMTILES_URL:-https://build.protomaps.com/20260630.pmtiles}
      - /data/basemap.pmtiles.partial
      - --bbox=${BASEMAP_BBOX:--125,24,-66,50}
    volumes:
      - basemap-data:/data
    restart: "no"

  # One-shot rename of the finished download onto the served path. Run after basemap-bootstrap succeeds.
  # Same volume, so the rename is atomic. The tag matches the Dockerfile ALPINE_IMAGE default.
  basemap-publish:
    image: alpine:3.22
    profiles: ["bootstrap"]
    command: ["mv", "-f", "/data/basemap.pmtiles.partial", "/data/basemap.pmtiles"]
    volumes:
      - basemap-data:/data
    restart: "no"

  # --- Public API ------------------------------------------------------------
  # The Rust api serves tiles, the manifest, the basemap (PMTiles and styles), and /api/*. The
  # Caddy and FastAPI sidecars are gone. The public endpoint is this service.
  api:
    build:
      context: ../..
      dockerfile: deploy/rust/Dockerfile
      target: api
    image: radar-ng-radar:local
    command: ["api"]
    ports:
      - "${TILE_SERVER_PORT:-8080}:8080"
    depends_on:
      temporal:
        condition: service_healthy
      open-meteo:
        condition: service_started
      volume-init:
        condition: service_completed_successfully
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      # WatchStormWorkflow start queue. Legacy runs every workflow on radar-ng, so the watch
      # must start there (see k8s/configmap-temporal-config.yaml).
      - TEMPORAL_ALERTS_TASK_QUEUE=radar-ng
      - OPEN_METEO_BASE=${OPEN_METEO_BASE:-http://open-meteo:8080/v1/forecast}
      - MRMS_MAX_AGE_S=${MRMS_MAX_AGE_S:-600}
      # Code default is 900 (radar-api/src/config.rs). The old compose value was 300. Keep the
      # code default unless a measured reason says otherwise (RUNBOOK.md, "Config drift").
      - FORECAST_TTL_S=${FORECAST_TTL_S:-900}
      - BASEMAP_PMTILES=/basemap/basemap.pmtiles
    volumes:
      - tiles:/data/tiles:ro
      - grids:/data/grids:ro
      - state:/data/state:ro
      - basemap-data:/basemap:ro
    healthcheck:
      # The image has busybox but no curl. /api/livez is process liveness, so this check never
      # depends on radar freshness. /api/health reports 503 when stale and is not used here.
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/livez"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  # --- Optional: per-role isolated queues (future, NOT the default) -----------
  # Enable only after the legacy cutover is complete and stable. Set USE_ISOLATED_TASK_QUEUES=1
  # on the worker and api, then replace `worker` with one service per role. Each polls its
  # default isolated queue (radar-ng-<role>), and the seeder rewrites every Schedule to its
  # declared queue. RUNBOOK.md section 9 has the procedure.
  #
  # mrms:
  #   image: radar-ng-radar:local
  #   pull_policy: never
  #   command: ["worker", "--role", "mrms"]
  #   environment:
  #     <<: *worker-env
  #     WORKER_ROLE: mrms
  #     USE_ISOLATED_TASK_QUEUES: "1"
  #   depends_on:
  #     temporal:
  #       condition: service_healthy
  #     volume-init:
  #       condition: service_completed_successfully
  #   volumes:
  #     - tiles:/data/tiles
  #     - grids:/data/grids
  #     - state:/data/state
  #   healthcheck: *worker-healthcheck
  #   restart: unless-stopped
  # (same shape for nowcast, hrrr, aux, alerts; SEED_SCHEDULES=1 on exactly one of them)

volumes:
  tiles:
    driver: local
  grids:
    driver: local
  state:
    driver: local
  openmeteo-data:
    driver: local
  basemap-data:
    driver: local
  temporal-pg-data:
    driver: local

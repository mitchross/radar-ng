appId: ${APP_ID}
name: temperature units apply to Home and survive relaunch
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: common/dismiss-system-prompts.yaml
- tapOn: "Settings"
- scrollUntilVisible:
    element: "°C"
    direction: DOWN
- tapOn: "°C"
- tapOn: "Home"
- extendedWaitUntil:
    visible: ".* degrees celsius"
    timeout: 30000
- takeScreenshot: celsius-home
- stopApp
- launchApp
- runFlow: common/dismiss-system-prompts.yaml
- extendedWaitUntil:
    visible: ".* degrees celsius"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element: "°F"
    direction: DOWN
- tapOn: "°F"
- tapOn: "Home"
- assertVisible: ".* degrees fahrenheit"

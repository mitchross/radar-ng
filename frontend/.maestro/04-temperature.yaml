appId: ${APP_ID}
name: temperature units apply to Home and survive relaunch
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: common/dismiss-system-prompts.yaml
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- scrollUntilVisible:
    element: "°C"
    direction: DOWN
- tapOn: "°C"
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Home
- extendedWaitUntil:
    visible: ".* degrees celsius"
    timeout: 30000
- takeScreenshot: celsius-home
- stopApp
- launchApp
- runFlow: common/dismiss-system-prompts.yaml
- extendedWaitUntil:
    visible: ".* degrees celsius"
    timeout: 30000
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- scrollUntilVisible:
    element: "°F"
    direction: DOWN
- tapOn: "°F"
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Home
- assertVisible: ".* degrees fahrenheit"

appId: ${APP_ID}
name: unavailable server and recovery
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: common/dismiss-system-prompts.yaml
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- scrollUntilVisible:
    element: "Adv"
    direction: UP
- tapOn: "Adv"
- scrollUntilVisible:
    element:
      id: "stack-url-input"
    direction: DOWN
- tapOn:
    id: "stack-url-input"
- eraseText
- inputText: "https://radar-qa.invalid"
- runFlow:
    # The Android keyboard covers the Save button.
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Save stack URL"
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Home
- extendedWaitUntil:
    visible: "Couldn’t load weather.*"
    timeout: 60000
- takeScreenshot: server-unavailable
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- scrollUntilVisible:
    element:
      id: "stack-url-input"
    direction: UP
- tapOn:
    id: "stack-url-input"
- eraseText
# STACK_URL: the working stack, passed by scripts/test-*-simulator.sh from identity.js.
- inputText: "${STACK_URL}"
- runFlow:
    # The Android keyboard covers the Save button.
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Save stack URL"
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Home
- extendedWaitUntil:
    visible: "Choose weather location.*"
    timeout: 60000
- takeScreenshot: server-recovered
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- scrollUntilVisible:
    element: "Simple"
    direction: UP
- tapOn: "Simple"

appId: ${APP_ID}
name: fresh install and primary screens
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: common/dismiss-system-prompts.yaml
- extendedWaitUntil:
    visible: "Choose weather location.*"
    timeout: 60000
- takeScreenshot: home
- scrollUntilVisible:
    element: "Open full radar.*"
    direction: DOWN
- takeScreenshot: home-radar-card
- tapOn: "Nowcast"
- extendedWaitUntil:
    visible: "NEXT-HOUR PRECIPITATION"
    timeout: 30000
- takeScreenshot: nowcast
- tapOn: "Alerts"
- assertVisible: "Refresh weather alerts"
- takeScreenshot: alerts
- tapOn: "Settings"
- assertVisible: "Search city"
- takeScreenshot: settings
- tapOn: "Home"
- tapOn: "Radar"
- extendedWaitUntil:
    visible: "Choose radar layer"
    timeout: 30000
- takeScreenshot: radar
- tapOn: "Choose radar layer"
- takeScreenshot: map-options
- tapOn: "Light map style"
- tapOn: "Radar radar layer"
- tapOn: "Home"
- assertVisible: "Current weather"

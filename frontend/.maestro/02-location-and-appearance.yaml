appId: ${APP_ID}
name: city selection and preferences survive relaunch
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: common/dismiss-system-prompts.yaml
# Denied location shows the "Location is off" card naming the fallback city, never "My Location".
# The "DEFAULT LOCATION" label is not in the accessibility tree (the location button exposes one
# combined label), so assert on the card copy instead.
- extendedWaitUntil:
    visible: "Location is off"
    timeout: 20000
- assertVisible: "Showing .*\\. Turn location on in Settings, or pick a city to follow instead\\."
- assertNotVisible: "MY LOCATION"
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- tapOn: "Search city"
- eraseText
- inputText: "Chicago"
- extendedWaitUntil:
    visible: "Use Chicago, Illinois.*"
    timeout: 20000
- tapOn: "Use Chicago, Illinois.*"
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Home
- extendedWaitUntil:
    visible: "Choose weather location. Current location: Chicago.*"
    timeout: 30000
- takeScreenshot: chicago-home
- stopApp
- launchApp
- runFlow: common/dismiss-system-prompts.yaml
- extendedWaitUntil:
    visible: "Choose weather location. Current location: Chicago.*"
    timeout: 30000
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- scrollUntilVisible:
    element: "Dark"
    direction: DOWN
- tapOn: "Dark"
- takeScreenshot: dark-settings
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Home
- takeScreenshot: dark-home
- stopApp
- launchApp
- runFlow: common/dismiss-system-prompts.yaml
- assertVisible: "Home"
- takeScreenshot: dark-relaunch
- runFlow:
    file: common/open-tab.yaml
    env:
      TAB: Settings
- scrollUntilVisible:
    element: "System"
    direction: DOWN
- tapOn: "System"

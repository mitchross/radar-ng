# In-cluster Level II load test (issue #293): 100 users doing the real close-up flow against the
# stateless level2-api (load/k6-level2.js). Temporary: it ships in its own talos PR (T3) after the
# shadow deploy is healthy, and a follow-up PR removes it. Never kubectl apply.
#
# Why 20 pods x 5 users, not 10 x 10: a client re-submits its view every 15 s and
# POST /api/level2/views allows 0.5 rps (burst 10) per client IP, so one IP carries at most 7 users.
# Each pod is one client IP. 10 users per pod would measure the limiter, not the service.
#
# Build the script ConfigMap with a Kustomize configMapGenerator named k6-level2-script from
# load/k6-level2.js (load/README.md). Runs, in order, each as its own sync:
#   1. steady, BASE_URL = the in-cluster level2-api Service (this file as written);
#   2. steady, BASE_URL = MRMS_URL = https://<shadow host> (the edge clock);
#   3. overflow: PROFILE=overflow, same BASE_URL as run 1.
# Read the per-pod JSON summaries from the logs, then score them with load/drills/gate.py.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-level2
spec:
  completionMode: Indexed
  completions: 20
  parallelism: 20
  # One lost pod must not fail the others (see load/k8s/k6-job.yaml).
  backoffLimitPerIndex: 0
  maxFailedIndexes: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: k6-level2
      annotations:
        descheduler.alpha.kubernetes.io/prevent-eviction: "true"
    spec:
      restartPolicy: Never
      # Keep load generators off the nodes serving what is measured.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tile-server
              namespaces: [radar-ng]
              topologyKey: kubernetes.io/hostname
            # TODO(C3): confirm the level2-api pod label from deploy/kubernetes on the C3 branch.
            - labelSelector:
                matchLabels:
                  app: level2-api
              namespaces: [radar-ng]
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
          args: ["run", "--quiet", "/scripts/k6-level2.js"]
          env:
            # TODO(C3): confirm the level2-api Service name and port.
            - name: BASE_URL
              value: http://level2-api.radar-ng.svc.cluster.local:8080
            - name: MRMS_URL
              value: http://tile-server.radar-ng.svc.cluster.local:8080
            - name: VUS
              value: "5"
            - name: PROFILE
              value: steady
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /scripts }
      volumes:
        - name: script
          configMap:
            name: k6-level2-script
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: k6-level2
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: k6-level2

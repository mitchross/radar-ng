name: ci · rust

# Checks for the backend (rust/), on every PR that touches it and on master.
#
#   lint-test   fmt, clippy -D warnings, cargo test --workspace (includes the offline Temporal replay gate)
#   temporal    radar-worker integration tests against a throwaway Temporal server
#   live-noaa   the newest real MRMS and HRRR files decoded and rendered (rust/scripts/live-noaa-check.sh)
#   binary      release `radar` built once on Bookworm with a cargo cache (shared with ghcr-backend)
#   images      every image target builds from that binary; glibc floor, image users, api smoke run,
#               open-meteo contract. The in-Docker source build runs only when the Dockerfile or
#               toolchain changed (or on manual runs), because its cargo cache mount is not kept on CI.

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'deploy/Dockerfile'
      - 'deploy/Dockerfile.dockerignore'
      - 'deploy/temporal-dev.yml'
      - '.github/workflows/ci-rust.yml'
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - 'deploy/Dockerfile'
      - 'deploy/Dockerfile.dockerignore'
      - 'deploy/temporal-dev.yml'
      - '.github/workflows/ci-rust.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PROTOC: /usr/bin/protoc

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: Rust toolchain (rust/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: Rust toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: temporal
      - name: Start Temporal
        run: |
          docker compose -f deploy/temporal-dev.yml up -d postgres temporal
          for _ in $(seq 1 80); do
            docker logs radar-ng-temporal 2>&1 | grep -Eiq 'namespace .*(registration complete|already registered)' && exit 0
            sleep 3
          done
          docker logs --tail 80 radar-ng-temporal; exit 1
      - name: Worker integration tests
        working-directory: rust
        env:
          TEMPORAL_TEST_ADDRESS: localhost:7233
          TEMPORAL_TEST_NAMESPACE: default
        run: |
          set -o pipefail
          cargo test --locked -p radar-worker --test integration -- --test-threads=1 2>&1 | tee ../integration.log
          ! grep -q 'skipped: TEMPORAL_TEST_ADDRESS' ../integration.log

  live-noaa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: Rust toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: live-noaa
      - run: rust/scripts/live-noaa-check.sh

  # Same build as ghcr-backend's `binary` job, sharing its cargo cache, so PRs and master reuse
  # compiled dependencies instead of rebuilding all of them inside Docker.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Bookworm glibc (2.36) matches the distroless runtime; the Ubuntu runner's glibc is newer.
    container: debian:bookworm-slim
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Build tools
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git zstd gcc libc6-dev make pkg-config protobuf-compiler libprotobuf-dev
      - uses: actions/checkout@v7
      # Default toolchain, not just the rust/ override: rust-cache runs `rustc -vV` from the repo root.
      - name: Rust toolchain (rust/rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bookworm-release
      - name: Build radar
        run: |
          cargo build --release --locked -p radar
          install -D -m 0755 target/release/radar ../dist/radar
      - uses: actions/upload-artifact@v7
        with:
          name: radar
          path: dist/radar
          retention-days: 1
          if-no-files-found: error

  images:
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      API: radar-ng-tile-server:ci
      WORKER: radar-ng-temporal-worker:ci
      OM: radar-ng-open-meteo-worker:ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: radar
          path: dist
      - uses: docker/setup-buildx-action@v4
      - name: Build the three targets from the CI binary
        run: |
          set -euo pipefail
          for t in api:$API worker:$WORKER open-meteo:$OM; do
            docker buildx build --load -f deploy/Dockerfile --target "${t%%:*}" -t "${t#*:}" \
              --build-arg RADAR_FROM=prebuilt --build-context radar-bin=dist \
              --cache-from type=gha,scope=ci-rust-prebuilt --cache-to type=gha,mode=max,scope=ci-rust-prebuilt .
          done
      # The default (RADAR_FROM=build) path is what Compose users run. Its cargo cache mount is lost
      # between CI runs, so a full compile only happens when something it depends on changed.
      - name: Did the in-Docker build inputs change?
        id: src
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$BASE" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || ! git diff --quiet "$BASE" HEAD -- deploy/Dockerfile deploy/Dockerfile.dockerignore rust/rust-toolchain.toml; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: In-Docker source build (api)
        if: steps.src.outputs.build == 'true'
        run: |
          # lint-test already runs the replay gate.
          docker buildx build -f deploy/Dockerfile --target api --build-arg REPLAY_GATE=0 \
            --cache-from type=gha,scope=ci-rust --cache-to type=gha,mode=max,scope=ci-rust .
      - name: Image users and replay-gate label
        run: |
          set -euo pipefail
          for i in $API $WORKER; do test "$(docker image inspect --format '{{.Config.User}}' $i)" = 1000:1000; done
          test "$(docker image inspect --format '{{.Config.User}}' $OM)" = 999:999
          for i in $API $WORKER $OM; do
            test "$(docker image inspect --format '{{ index .Config.Labels "io.radar-ng.replay-gate" }}' $i)" = rust-offline-replay
          done
      - name: glibc floor (bookworm-built binary on the Open-Meteo base)
        run: |
          set -euo pipefail
          docker run --rm $OM --version
          c=$(docker create $API); docker cp "$c:/usr/local/bin/radar" ./radar-bin; docker rm "$c" >/dev/null
          need=$(objdump -T ./radar-bin | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          have=$(docker run --rm --entrypoint /bin/sh $OM -c 'ldd --version | head -1' | grep -oE '[0-9]+\.[0-9]+$')
          echo "radar needs glibc $need, open-meteo base has $have"
          test "$(printf '%s\n%s\n' "$need" "$have" | sort -V | tail -1)" = "$have"
      - name: Worker probe helpers
        run: |
          docker run --rm --entrypoint sh $WORKER -c \
            'echo > /tmp/worker-alive && test "$(find /tmp/worker-alive -mmin -3)"'
      - name: api smoke run on empty data
        run: |
          set -euo pipefail
          mkdir -p smoke/tiles smoke/grids smoke/state && chmod -R 0755 smoke
          docker run -d --name api -p 127.0.0.1:18080:8080 \
            -v "$PWD/smoke/tiles:/data/tiles:ro" -v "$PWD/smoke/grids:/data/grids:ro" -v "$PWD/smoke/state:/data/state:ro" $API
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18080/api/livez && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/api/livez | grep -q '"status":"ok"'
          code=$(curl -s -o health.json -w '%{http_code}' http://127.0.0.1:18080/api/health)
          cat health.json; echo
          test "$code" = 503 && grep -q no_mrms_tiles health.json
          docker rm -f api
      - name: Open-Meteo image contract
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh $OM -ec '
            test -x /app/openmeteo-api
            if ldd /app/openmeteo-api | grep -F "not found"; then exit 1; fi'
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' $OM)" = 'MIT AND AGPL-3.0-only'
          docker run --rm --entrypoint /app/openmeteo-api $OM sync --help | grep -F 'Download the open-meteo weather database'
          docker run -d --name om -p 127.0.0.1:18081:8080 --entrypoint /app/openmeteo-api $OM \
            serve --env production --hostname 0.0.0.0 --port 8080
          for _ in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Running}}' om)" = true || { docker logs om; exit 1; }
            timeout 1 bash -c '</dev/tcp/127.0.0.1/18081' 2>/dev/null && { docker rm -f om; exit 0; }
            sleep 1
          done
          docker logs om; exit 1

name: ci · frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test -- --runInBand

      - name: Expo doctor
        run: bunx expo-doctor

      - name: SDK-pinned versions
        run: bunx expo install --check

      # Both production bundles must build; nothing here needs a native toolchain.
      - name: Export iOS bundle
        run: bunx expo export --platform ios --output-dir dist/ios

      - name: Export Android bundle
        run: bunx expo export --platform android --output-dir dist/android

name: ghcr · web

# The web radar (radar.vanillax.me): static build served by nginx.
# Runs on push to master, or manually with an explicit version.
# PostHog: set the repository variable POSTHOG_PROJECT_KEY to the project's
# public phc_ key (gh variable set POSTHOG_PROJECT_KEY); unset builds ship
# with analytics off.

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/ghcr-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ghcr-web.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version tag to publish (e.g. v1.2.3)'
        required: false
        default: ''

concurrency:
  group: ghcr-web-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  # Pull requests: build and smoke-test only, with a read-only token
  # (permissions can't be conditional, so this is its own job).
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: web
          file: web/Dockerfile
          build-args: |
            VITE_POSTHOG_KEY=${{ vars.POSTHOG_PROJECT_KEY }}
          load: true
          tags: radar-ng-web:smoke
          cache-from: type=gha,scope=ghcr-web

      - name: Smoke test (status and Content-Type)
        run: |
          set -euo pipefail
          docker run -d --name web -p 127.0.0.1:18090:8080 radar-ng-web:smoke
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:18090/healthz >/dev/null && break; sleep 1; done
          ct() { curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://127.0.0.1:18090$1"; }
          check() { got=$(ct "$1"); echo "$1 -> $got"; case "$got" in "200 $2"*) ;; *) echo "::error::$1 served '$got', want 200 $2"; exit 1;; esac; }
          check / text/html
          check /some/deep/link text/html
          check /manifest.webmanifest application/manifest+json
          js=$(curl -s http://127.0.0.1:18090/ | grep -o '/assets/[^"]*\.js' | head -1)
          check "$js" application/javascript
          docker rm -f web

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR names must be lowercase; repository_owner keeps the account's casing.
      # Upstream this is `mitchross`, so the published image names are unchanged.
      - name: Image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Compute next semver from registry
        id: ver
        env:
          EXPLICIT: ${{ github.event.inputs.version }}
        run: |
          version=$(bash .github/scripts/next-semver.sh "$IMAGE_OWNER" v0.1.0 radar-ng-web)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/radar-ng-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ steps.ver.outputs.version }}

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: web
          file: web/Dockerfile
          build-args: |
            VITE_POSTHOG_KEY=${{ vars.POSTHOG_PROJECT_KEY }}
          load: true
          tags: radar-ng-web:smoke
          cache-from: type=gha,scope=ghcr-web

      - name: Smoke test (status and Content-Type)
        run: |
          set -euo pipefail
          docker run -d --name web -p 127.0.0.1:18090:8080 radar-ng-web:smoke
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:18090/healthz >/dev/null && break; sleep 1; done
          ct() { curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://127.0.0.1:18090$1"; }
          check() { got=$(ct "$1"); echo "$1 -> $got"; case "$got" in "200 $2"*) ;; *) echo "::error::$1 served '$got', want 200 $2"; exit 1;; esac; }
          check / text/html
          check /some/deep/link text/html
          check /manifest.webmanifest application/manifest+json
          js=$(curl -s http://127.0.0.1:18090/ | grep -o '/assets/[^"]*\.js' | head -1)
          check "$js" application/javascript
          docker rm -f web

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: web
          file: web/Dockerfile
          build-args: |
            VITE_POSTHOG_KEY=${{ vars.POSTHOG_PROJECT_KEY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ghcr-web
          cache-to: type=gha,mode=max,scope=ghcr-web

      - name: Published reference
        run: |
          ref="ghcr.io/${{ env.IMAGE_OWNER }}/radar-ng-web:${{ steps.ver.outputs.version }}@${{ steps.build.outputs.digest }}"
          echo "::notice title=published::$ref"
          echo "Published \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

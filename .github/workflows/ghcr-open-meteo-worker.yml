name: ghcr · open-meteo-worker

# Public GHCR image of the Open-Meteo API + sync worker: the Open-Meteo base with the Rust `radar`
# binary (deploy/Dockerfile, target `open-meteo`).

on:
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - 'deploy/Dockerfile'
      - 'deploy/Dockerfile.dockerignore'
      - 'rust/assets/basemap/styles/**'
      - 'rust/assets/basemap/fetch-glyphs.sh'
      - '.github/workflows/ghcr-open-meteo-worker.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version tag to publish (e.g. v1.2.3)'
        required: false
        default: ''

concurrency:
  group: ghcr-open-meteo-worker-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute next semver from registry
        id: ver
        run: |
          set -euo pipefail
          IMAGE="radar-ng-open-meteo-worker"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEXT="${{ github.event.inputs.version }}"
          else
            TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/${IMAGE}:pull" | jq -r .token)
            LATEST=$(curl -s -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${{ github.repository_owner }}/${IMAGE}/tags/list" \
              | jq -r '.tags[]?' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1 \
              || true)
            if [ -z "${LATEST:-}" ]; then
              NEXT="v1.1.5"
            else
              STRIPPED=${LATEST#v}
              MAJOR=${STRIPPED%%.*}
              REST=${STRIPPED#*.}
              MINOR=${REST%%.*}
              PATCH=${REST#*.}
              NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          # The Rust rewrite starts the v2 line. Never publish below it.
          FLOOR="v2.0.0"
          if [ "$(printf '%s\n%s\n' "$NEXT" "$FLOOR" | sort -V | head -1)" != "$FLOOR" ]; then
            NEXT="$FLOOR"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Calculated version: $NEXT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/radar-ng-open-meteo-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ steps.ver.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: .
          file: deploy/Dockerfile
          target: open-meteo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.licenses=MIT AND AGPL-3.0-only
            org.opencontainers.image.base.name=ghcr.io/open-meteo/open-meteo:1.6.0
            org.opencontainers.image.base.digest=sha256:e1517a01a061fd96e2a9017d022c5809bb51725bcd733bcbed435e7ea32dd9da
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Published reference
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/radar-ng-open-meteo-worker:${{ steps.ver.outputs.version }}@${{ steps.build.outputs.digest }}"
          echo "::notice title=published::$ref"
          echo "Published \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

name: build · ios

# Runs on the self-hosted Mac (label `ios`); signing keychain, API key and ~/bin/ios-build live on that host.
on:
  workflow_dispatch:
    inputs:
      scheme:
        description: Xcode scheme
        required: true
        default: radarng
        type: string

permissions:
  contents: read

concurrency:
  group: build-ios
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: [self-hosted, ios]
    timeout-minutes: 60
    env:
      IOS_BUILD_RUN: ${{ github.run_number }}.${{ github.run_attempt }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # Plain swiftc on the Mac, no simulator. RadarShared.swift is what WatchAPI and RadarAPI read.
      - name: Swift checks
        run: |
          swiftc targets/watch/WatchAPI.swift targets/watch/WatchForecastPresentation.swift \
            targets/watch/RadarShared.swift tests/watch/PresentationChecks.swift -o "$RUNNER_TEMP/presentation-checks"
          "$RUNNER_TEMP/presentation-checks"
          swiftc -parse-as-library targets/carplay/RadarRouteProgress.swift targets/carplay/RadarAPI.swift \
            targets/carplay/RadarShared.swift tests/carplay/RouteProgressChecks.swift -o "$RUNNER_TEMP/route-progress-checks"
          "$RUNNER_TEMP/route-progress-checks"

      - name: Prebuild native project
        run: bunx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: frontend/ios
        run: RUBYOPT="-r$PWD/../scripts/cocoapods_xcodeproj_object_version_70" pod install

      # Fails on master today: expo-background-task adds fetch/processing modes the check rejects.
      - name: Release preflight
        continue-on-error: true
        run: bash scripts/preflight-ios-release.sh

      - name: Write export options
        run: |
          plutil -create xml1 ExportOptions.plist
          plutil -insert method -string app-store-connect ExportOptions.plist
          plutil -insert signingStyle -string automatic ExportOptions.plist
          plutil -insert teamID -string "$(node -p "require('./identity').appleTeamId")" ExportOptions.plist

      - name: Archive and export
        working-directory: frontend/ios
        env:
          SCHEME: ${{ inputs.scheme }}
          EXPORT_OPTIONS: ../ExportOptions.plist
        run: ~/bin/ios-build "$SCHEME" build

      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: frontend/ios/build/*.ipa
          if-no-files-found: error

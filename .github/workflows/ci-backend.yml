name: ci · backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'temporal/**'
      - '!temporal/open_meteo_worker.py'
      - '!temporal/open_meteo_worker.Dockerfile'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'temporal/**'
      - '!temporal/open_meteo_worker.py'
      - '!temporal/open_meteo_worker.Dockerfile'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: temporal/Dockerfile
          load: true
          tags: radar-ng-temporal-worker:ci
          cache-from: type=gha,scope=ci-temporal-worker
          cache-to: type=gha,mode=max,scope=ci-temporal-worker

      - name: Run worker unit and replay tests in the image
        run: >-
          docker run --rm --entrypoint sh radar-ng-temporal-worker:ci -c
          'pip install --disable-pip-version-check pytest==9.0.3 &&
          python -m pytest -q
          backend/ingest_airquality
          backend/ingest_hrrr
          backend/ingest_lightning
          backend/ingest_mrms
          backend/ingest_tropical
          backend/nowcast
          backend/shared
          backend/tile_cleanup
          temporal'

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release tile-server image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/api/Dockerfile
          load: true
          tags: radar-ng-tile-server:ci
          cache-from: type=gha,scope=ci-tile-server
          cache-to: type=gha,mode=max,scope=ci-tile-server

      - name: Run API unit tests in the image
        run: >-
          docker run --rm --user 0 --entrypoint sh radar-ng-tile-server:ci -c
          'pip install --disable-pip-version-check pytest==9.0.3 numpy==1.26.4 &&
          python -m pytest -q backend/api/api'

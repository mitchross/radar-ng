name: ci · backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'temporal/**'
      - '!temporal/open_meteo_worker.py'
      - '!temporal/open_meteo_worker.Dockerfile'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'temporal/**'
      - '!temporal/open_meteo_worker.py'
      - '!temporal/open_meteo_worker.Dockerfile'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the release worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: temporal/Dockerfile
          load: true
          tags: radar-ng-temporal-worker:ci
          cache-from: type=gha,scope=ci-temporal-worker
          cache-to: type=gha,mode=max,scope=ci-temporal-worker

      - name: Run worker unit tests in the image
        run: >-
          docker run --rm --entrypoint sh radar-ng-temporal-worker:ci -c
          'pip install --disable-pip-version-check pytest==9.0.3 &&
          python -m pytest -q
          backend/ingest_airquality
          backend/ingest_hrrr
          backend/nowcast
          backend/shared
          backend/tile_cleanup
          temporal'

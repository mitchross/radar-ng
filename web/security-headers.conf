# Included at server level and in every location that has its own add_header:
# an add_header in a location drops all headers inherited from the server block.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# PostHog is the only third-party origin; basemap tiles and the API are same-origin via the HTTPRoute.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://ingest-posthog.vanillax.me; connect-src 'self' https://ingest-posthog.vanillax.me; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2ea" />
    <title>Radar NG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z' fill='%23c2603a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map" aria-label="Radar map"></div>

    <aside id="panel" class="panel glass" aria-label="Forecast">
      <div class="panel-head">
        <form id="search" class="search" role="search" autocomplete="off">
          <input id="search-input" type="search" placeholder="Search a city" aria-label="Search a city" />
          <ul id="search-results" class="search-results" role="listbox" hidden></ul>
        </form>
        <button id="panel-toggle" class="icon-btn" aria-label="Collapse forecast" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="panel-body" class="panel-body">
        <p class="muted">Loading forecast…</p>
      </div>
    </aside>

    <div class="controls">
      <div id="layers" class="chips glass" role="radiogroup" aria-label="Weather layer"></div>
      <div class="control-row">
        <div id="styles" class="chips glass" role="radiogroup" aria-label="Map style"></div>
        <button id="locate" class="icon-btn glass" aria-label="Center on my location">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 4L4 11l7 2 2 7z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <div id="legend" class="legend glass" aria-label="Legend" hidden></div>

    <section class="timeline glass" aria-label="Radar timeline">
      <div class="timeline-head">
        <button id="play" class="play" aria-label="Play radar animation">
          <svg id="play-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <div class="timeline-title">
          <div id="frame-title" class="frame-title">Radar</div>
          <div id="frame-time" class="frame-time">&nbsp;</div>
        </div>
        <div id="zoom" class="segmented" role="radiogroup" aria-label="Timeline range">
          <button data-zoom="1h" role="radio" aria-checked="true">1h</button>
          <button data-zoom="48h" role="radio" aria-checked="false">48h</button>
        </div>
      </div>
      <div class="track">
        <div id="track-segments" class="track-segments"></div>
        <input id="slider" type="range" min="0" max="0" value="0" step="1" aria-label="Radar time" />
      </div>
      <div id="axis" class="axis"></div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
